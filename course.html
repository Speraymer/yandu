<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data: https://api.deepseek.com https://api.openai.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>研读 · 课程学习</title><link rel="icon" href="./icons/book-open.svg">
<link rel="stylesheet" href="./reader.css?v=2"><link rel="stylesheet" href="./study.css?v=5"><link rel="stylesheet" href="./katex/katex.min.css"><link rel="stylesheet" href="./theme.css?v=8"><link rel="stylesheet" href="./course.css">
<script src="./theme.js?v=2"></script><script defer src="./course-vendor/capture/html-to-image.js"></script><script type="module" src="./course.js?v=3"></script></head>
<body class="course">
<header><div class="brand"><img src="icons/book-open.svg" alt="">研读</div><a href="./">论文阅读</a><strong class="mode">课程学习</strong>
<div class="project-picker"><select id="projects" aria-label="当前课程项目"></select><button id="addProject" disabled>新建项目</button></div>
<button id="import" disabled><img src="icons/upload.svg" alt="">导入课件</button><input type="file" id="files" accept=".pptx,.pdf,.ppt" multiple hidden>
<button id="settings"><img src="icons/settings-2.svg" alt="">AI 设置</button><button id="themeToggle" title="切换模式"><img src="icons/sun.svg" alt=""><span>白天</span></button></header>
<main>
<section id="reading" aria-label="课件阅读">
<div id="deckBar" hidden><section><small id="courseStats"></small><select id="decks" aria-label="当前课件"></select></section>
<details id="deckMenu"><summary>整份标记</summary><div><button id="allLearned">整份设为已学</button><button id="allNew">整份设为未学</button></div></details></div>
<div id="stage" title="用方向键或滚轮翻页，翻过的页面自动标为已学"><section id="empty"><img src="icons/library-big.svg" alt=""><h1 id="emptyTitle">从一门课程开始</h1><p id="emptyText">为这门课建一个项目，把每次上课的课件放在一起。</p><button id="start" disabled class="primary">新建课程项目</button></section>
<img id="slide" alt="" hidden></div>
<div id="pageBar" hidden><div class="pager"><button id="prev" aria-label="上一页">‹</button><label>第 <input id="page" type="number" min="1" aria-label="跳至页码"> / <span id="count"></span> 页</label><button id="next" aria-label="下一页">›</button></div><label class="learned"><input type="checkbox" id="learned">本页已学</label><small id="deckStats"></small></div>
<div id="activity" role="status" hidden></div>
</section>
<aside id="side"><div id="paneDivider" role="separator" tabindex="0" aria-label="课件与问答分栏宽度" aria-orientation="vertical" aria-controls="reading side"></div>
<div class="side-head"><span>课程问答</span><button class="mobile-only" id="closeChat">看课件</button></div>
<div id="messages" aria-live="polite"></div>
<form id="composer"><small id="scopeHint">请先打开课件</small><textarea id="question" rows="2" maxlength="6000" aria-label="课程问题" placeholder="问问这一页…"></textarea>
<div class="compose-bottom"><small id="inputMode"></small><button id="send" type="submit" aria-label="发送问题" disabled><img src="icons/arrow-up.svg" alt=""></button></div></form>
<div class="status" id="keyStatus"></div></aside>
<button class="mobile-only" id="openChat">课程问答</button>
</main>
<dialog id="projectDialog"><form method="dialog" class="dialog-head"><h2>新建课程项目</h2><button aria-label="关闭">×</button></form><form id="newProject"><label>项目名称<input id="projectName" maxlength="80" required placeholder="例如：计算机组成原理"></label><p>同一项目的课件、学习进度和问答保存在此浏览器。</p><button class="primary">创建项目</button></form></dialog>
<dialog id="settingDialog"><form method="dialog" class="dialog-head"><h2>课程问答设置</h2><button aria-label="关闭">×</button></form><form id="setup">
<label>模型服务<select id="provider"><option value="deepseek">DeepSeek 官方</option><option value="openai">OpenAI 官方</option></select></label><label>模型名称<input id="model" maxlength="100" required pattern="[A-Za-z0-9._:\-]+"></label>
<label>API Key<input type="password" id="key" autocomplete="off" maxlength="1024"></label><label class="remember-choice"><input type="checkbox" id="remember">在此浏览器记住密钥</label><small id="keyHelp"></small><button type="button" id="forgetKey">忘记此密钥</button>
<label class="remember-choice" id="visionOption"><input type="checkbox" id="vision">提问时附上当前页图片</label>
<p>提问会向所选服务发送本页内容、同课程相关摘录、学习进度和最近对话。读图需要支持图片输入的模型，调用计入你的账户。</p>
<p class="error" id="configError" role="alert"></p><button class="primary">应用设置</button></form></dialog>
</body></html>
